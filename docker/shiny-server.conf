# TransXplorer Shiny Server Configuration
run_as shiny;

# Preserve logs for debugging
preserve_logs true;

# Don't sanitize errors
sanitize_errors false;

# Each location runs its own R process. Shiny serves all sessions of a process one task at a time,
# so a long analysis (GRN, WGCNA, ...) holds up everyone on that process. nginx spreads visitors
# over the pool /transxplorer, /w2, /w3, /w4 (sticky per client); "/" serves the health check.
# app_idle_timeout 0 keeps every process alive: starting one loads every package (~10 s).
server {
  listen 3838;

  location /transxplorer {
    app_idle_timeout 0;
    app_init_timeout 180;
    app_dir /srv/shiny-server/transxplorer;
    log_dir /var/log/shiny-server;
    directory_index on;
  }

  location /w2 {
    app_idle_timeout 0;
    app_init_timeout 180;
    app_dir /srv/shiny-server/transxplorer;
    log_dir /var/log/shiny-server;
    directory_index on;
  }

  location /w3 {
    app_idle_timeout 0;
    app_init_timeout 180;
    app_dir /srv/shiny-server/transxplorer;
    log_dir /var/log/shiny-server;
    directory_index on;
  }

  location /w4 {
    app_idle_timeout 0;
    app_init_timeout 180;
    app_dir /srv/shiny-server/transxplorer;
    log_dir /var/log/shiny-server;
    directory_index on;
  }

  location / {
    app_idle_timeout 0;
    app_init_timeout 180;
    app_dir /srv/shiny-server/transxplorer;
    log_dir /var/log/shiny-server;
    directory_index on;
  }
}

# NOTE: simple_scheduler and reconnect are Shiny Server Pro features;
# app_idle_timeout and app_init_timeout work in the open-source edition.
