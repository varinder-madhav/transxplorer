# TransXplorer Shiny Server Configuration
run_as shiny;

# Preserve logs for debugging
preserve_logs true;

# Don't sanitize errors
sanitize_errors false;

# Define a server that listens on port 3838
server {
  listen 3838;

  location /transxplorer {
    # Keep the R process alive between visitors: starting one loads every
    # package (~10 s), which the next visitor would otherwise wait for.
    app_idle_timeout 0;
    app_init_timeout 180;
    app_dir /srv/shiny-server/transxplorer;
    log_dir /var/log/shiny-server;
    directory_index on;
  }

  location / {
    # Keep the R process alive between visitors: starting one loads every
    # package (~10 s), which the next visitor would otherwise wait for.
    app_idle_timeout 0;
    app_init_timeout 180;
    app_dir /srv/shiny-server/transxplorer;
    log_dir /var/log/shiny-server;
    directory_index on;
  }
}

# NOTE: simple_scheduler and reconnect are Shiny Server Pro features;
# app_idle_timeout and app_init_timeout work in the open-source edition. Session management is handled in-app via
# session$onSessionEnded() and shiny.autoreload options.
